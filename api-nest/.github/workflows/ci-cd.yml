name: 🚀 CI/CD Pipeline - Open Banking API

on:
  push:
    branches: [ main, developer, develop ]
  pull_request:
    branches: [ main, developer, develop ]

env:
  NODE_VERSION: '20.x'
  POSTGRES_VERSION: '15'

jobs:
  # 🔍 Análise de Código
  code-analysis:
    name: 🔍 Análise de Código
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'
        
    - name: 📦 Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: 🔍 ESLint
      run: yarn lint
      
    - name: 🎨 Prettier check
      run: yarn format:check
      
    - name: 🔒 Security audit
      run: yarn audit

  # 🧪 Testes
  test:
    name: 🧪 Testes
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_banking_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'
        
    - name: 📦 Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: 🔧 Setup test environment
      run: |
        echo "DB_HOST=localhost" >> .env.test
        echo "DB_PORT=5432" >> .env.test
        echo "DB_USERNAME=postgres" >> .env.test
        echo "DB_PASSWORD=postgres" >> .env.test
        echo "DB_DATABASE=open_banking_test" >> .env.test
        echo "JWT_SECRET=test-secret-key" >> .env.test
        
    - name: 🗄️ Run database migrations
      run: yarn migration:run
      
    - name: 🧪 Run unit tests
      run: yarn test
      
    - name: 🧪 Run e2e tests
      run: yarn test:e2e
      
    - name: 📊 Generate coverage report
      run: yarn test:cov
      
    - name: 📈 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  # 🏗️ Build
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [code-analysis, test]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'
        
    - name: 📦 Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: 🏗️ Build application
      run: yarn build
      
    - name: 📦 Build Docker image
      run: docker build -t open-banking-api:${{ github.sha }} .
      
    - name: 📋 List build artifacts
      run: ls -la dist/

  # 🚀 Deploy (apenas na branch main)
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [code-analysis, test, build]
    if: github.ref == 'refs/heads/main'
    
    environment: production
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'yarn'
        
    - name: 📦 Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: 🏗️ Build for production
      run: yarn build
      
    - name: 🐳 Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: 🐳 Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/open-banking-api:latest .
        docker build -t ${{ secrets.DOCKER_USERNAME }}/open-banking-api:${{ github.sha }} .
        docker push ${{ secrets.DOCKER_USERNAME }}/open-banking-api:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/open-banking-api:${{ github.sha }}
        
    - name: 🚀 Deploy to server
      run: |
        echo "🚀 Deploying to production server..."
        # Aqui você pode adicionar comandos para deploy real
        # Por exemplo: SSH para seu servidor, kubectl, etc.

  # 📊 Relatório Final
  report:
    name: 📊 Relatório Final
    runs-on: ubuntu-latest
    needs: [code-analysis, test, build]
    if: always()
    
    steps:
    - name: 📊 Generate summary
      run: |
        echo "## 🏦 Open Banking API - CI/CD Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📅 Execução: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "### 🌿 Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.code-analysis.result }}" == "success" ]; then
          echo "✅ **Análise de Código**: Passou" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Análise de Código**: Falhou" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.test.result }}" == "success" ]; then
          echo "✅ **Testes**: Passaram" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Testes**: Falharam" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.build.result }}" == "success" ]; then
          echo "✅ **Build**: Sucesso" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Build**: Falhou" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🎯 Próximos Passos:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Verificar relatórios de cobertura" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Revisar logs de build" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Testar em ambiente de staging" >> $GITHUB_STEP_SUMMARY
