version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Containerfile.dev
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:senhasegura@db:5432/open_banking_dev?schema=public
      - JWT_SECRET=dev-jwt-secret-key-change-in-production
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senhasegura
      POSTGRES_DB: open_banking_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
